name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  spotless:
    name: 1. Spotless Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn spotless:check

  test:
    name: 2. Run All Tests
    runs-on: ubuntu-latest
    needs: spotless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn test

      - name: Upload JaCoCo Execution Data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exec
          path: target/jacoco.exec
          retention-days: 1

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-json
          path: benchmark-results.json
          retention-days: 1

  jacoco-check:
    name: 3. JaCoCo Check & Report
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Download JaCoCo Execution Data
        uses: actions/download-artifact@v4
        with:
          name: jacoco-exec
          path: target

      - run: mvn verify -DskipTests

      - name: Upload JaCoCo XML Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-xml
          path: target/site/jacoco/jacoco.xml
          retention-days: 30

  build:
    name: 4. Build JAR
    runs-on: ubuntu-latest
    needs: jacoco-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-file
          path: target/*.jar
          retention-days: 30

  upload-artifacts:
    name: 5. Upload Artifacts
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download JaCoCo XML
        uses: actions/download-artifact@v4
        with:
          name: jacoco-xml
          path: artifacts/jacoco

      - name: Download Benchmark JSON
        uses: actions/download-artifact@v4
        with:
          name: benchmark-json
          path: artifacts/benchmark

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: jar-file
          path: artifacts/jar

      - name: Final Upload - JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: artifacts/jacoco/
          retention-days: 30

      - name: Final Upload - Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: artifacts/benchmark/
          retention-days: 30

      - name: Final Upload - JAR
        uses: actions/upload-artifact@v4
        with:
          name: wal-jar
          path: artifacts/jar/
          retention-days: 30