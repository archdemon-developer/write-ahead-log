name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  stage-1-spotless:
    name: Stage 1 - Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: maven
      - run: mvn spotless:check

  stage-2-unit-tests:
    name: Stage 2 - Unit Tests
    runs-on: ubuntu-latest
    needs: stage-1-spotless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: maven
      - run: mvn clean test -Dtest='!*IntegrationTest,!*Benchmark*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: target/surefire-reports/

  stage-3-jacoco-verify:
    name: Stage 3 - Code Coverage Verification
    runs-on: ubuntu-latest
    needs: stage-2-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: maven
      - run: mvn clean verify -Dtest='!*IntegrationTest,!*Benchmark*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

  stage-4-integration-tests:
    name: Stage 4 - Integration Tests
    runs-on: ubuntu-latest
    needs: stage-3-jacoco-verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: maven
      - run: mvn clean test -Dtest='*IntegrationTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: target/surefire-reports/

  stage-5-benchmarks:
    name: Stage 5 - Performance Benchmarks
    runs-on: ubuntu-latest
    needs: stage-4-integration-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: maven
      - run: mvn clean test -Dtest='BenchmarkRunner'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark-results.json

  stage-6-collate-artifacts:
    name: Stage 6 - Generate Reports
    runs-on: ubuntu-latest
    needs: [stage-3-jacoco-verify, stage-5-benchmarks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-results
      - run: |
          mkdir -p reports
          chmod +x scripts/*.sh
          ./scripts/generate-reports.sh
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            reports/
            BENCHMARK_RESULTS.md
            JACOCO_RESULTS.md

  stage-7-publish:
    name: Stage 7 - Publish Artifacts
    runs-on: ubuntu-latest
    needs: stage-6-collate-artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reports
          path: reports/
      - uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: test-results/
      - name: Create Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp reports/* release-artifacts/ 2>/dev/null || true
          cp BENCHMARK_RESULTS.md release-artifacts/ 2>/dev/null || true
          cp JACOCO_RESULTS.md release-artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts/