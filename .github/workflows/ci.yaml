name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  spotless:
    name: 1. Spotless Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn spotless:check

  unit-tests:
    name: 2. Unit Tests
    runs-on: ubuntu-latest
    needs: spotless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn test

  jacoco-check:
    name: 3. JaCoCo Check & Report
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn verify -DskipTests

      - name: Upload JaCoCo XML
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-xml
          path: target/site/jacoco/jacoco.xml
          retention-days: 30

  integration-tests:
    name: 4. Integration Tests
    runs-on: ubuntu-latest
    needs: jacoco-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn verify -Dgroups="integration" -DskipUnitTests=true

  benchmarks:
    name: 5. Benchmarks
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn verify -Dgroups="benchmark" -DskipUnitTests=true

      - name: Upload Benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-json
          path: benchmark-results.json
          retention-days: 30

  build:
    name: 6. Build JAR
    runs-on: ubuntu-latest
    needs: benchmarks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-file
          path: target/*.jar
          retention-days: 30

  upload-artifacts:
    name: 7. Upload Artifacts
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download JaCoCo XML
        uses: actions/download-artifact@v4
        with:
          name: jacoco-xml
          path: artifacts/jacoco

      - name: Download Benchmark JSON
        uses: actions/download-artifact@v4
        with:
          name: benchmark-json
          path: artifacts/benchmark

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: jar-file
          path: artifacts/jar

      - name: Final Upload - JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: artifacts/jacoco/
          retention-days: 30

      - name: Final Upload - Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: artifacts/benchmark/
          retention-days: 30

      - name: Final Upload - JAR
        uses: actions/upload-artifact@v4
        with:
          name: wal-jar
          path: artifacts/jar/
          retention-days: 30